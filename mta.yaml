_schema-version: 3.3.0

ID: Zpurchase_request_management
description: A simple CAP project.
version: 1.0.0

modules:

  # ============================================================
  # CAP SERVICE
  # ============================================================
  - name: Zpurchase_request_management-srv
    type: nodejs
    path: gen/srv

    requires:
      - name: Zpurchase_request_management-auth
      - name: Zpurchase_request_management-db

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    parameters:
      buildpack: nodejs_buildpack
      instances: 1

    build-parameters:
      builder: npm-ci


  # ============================================================
  # HANA DB DEPLOYER
  # ============================================================
  - name: Zpurchase_request_management-db-deployer
    type: hdb
    path: gen/db

    requires:
      - name: Zpurchase_request_management-db

    parameters:
      buildpack: nodejs_buildpack


  # ============================================================
  # HTML5 UI
  # ============================================================
  - name: purchase-ui
    type: html5
    path: app/purchase-ui

    build-parameters:
      build-result: dist
      builder: custom

      commands:
        - npm install
        - npm run build:cf

      supported-platforms: []


  # ============================================================
  # HTML5 APP CONTENT
  # ============================================================
  - name: Zpurchase_request_management-app-content
    type: com.sap.application.content
    path: .

    requires:
      # IMPORTANT:
      # Only HTML5 repo-host is a content-target
      - name: Zpurchase_request_management-repo-host
        parameters:
          content-target: true

    build-parameters:
      build-result: resources

      requires:
        - artifacts:
            - purchase-ui.zip
          name: purchase-ui
          target-path: resources/


# ================================================================
# RESOURCES
# ================================================================
resources:

  # ============================================================
  # XSUAA
  # ============================================================
  - name: Zpurchase_request_management-auth
    type: org.cloudfoundry.managed-service

    parameters:
      config:
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509

        tenant-mode: dedicated

        xsappname: Zpurchase_request_management-${org}-${space}

      path: ./xs-security.json

      service: xsuaa
      service-plan: application


  # ============================================================
  # HANA HDI CONTAINER
  # ============================================================
  - name: Zpurchase_request_management-db
    type: com.sap.xs.hdi-container

    parameters:
      service: hana
      service-plan: hdi-shared


  # ============================================================
  # HTML5 APPLICATION REPOSITORY
  # ============================================================
  - name: Zpurchase_request_management-repo-host
    type: org.cloudfoundry.managed-service

    parameters:
      service: html5-apps-repo
      service-name: Zpurchase_request_management-html5-service
      service-plan: app-host


  # ============================================================
  # DESTINATION SERVICE
  # ============================================================
  - name: Zpurchase_request_management-destination-service
    type: org.cloudfoundry.managed-service

    # IMPORTANT:
    # This is needed because the destination URL references
    # the srv-api provided by the CAP service.
    requires:
      - name: srv-api

    parameters:
      config:

        HTML5Runtime_enabled: true

        init_data:
          instance:

            destinations:

              # ------------------------------------------------
              # UI5
              # ------------------------------------------------
              - Name: ui5
                Authentication: NoAuthentication
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com

              # ------------------------------------------------
              # CAP OData Service
              # ------------------------------------------------
              - Name: PurchaseService
                Description: CAP Purchase Request Service
                Authentication: NoAuthentication
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true

          existing_destinations_policy: update

        version: 1.0.0

      service: destination
      service-name: Zpurchase_request_management-destination-service
      service-plan: lite


# ================================================================
# GLOBAL PARAMETERS
# ================================================================
parameters:

  deploy_mode: html5-repo

  enable-parallel-deployments: true


# ================================================================
# BUILD
# ================================================================
build-parameters:

  before-all:

    - builder: custom

      commands:
        - npm ci
        - npx cds build --production